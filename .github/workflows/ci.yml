name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ts:
        name: TypeScript（bridge + tools）
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test
            - run: pnpm -r build

